name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      run-macos: ${{ steps.filter.outputs.run-macos }}
      run-android: ${{ steps.filter.outputs.run-android }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF=$(git diff --name-only origin/${{ github.base_ref }} HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "ALL")
          else
            # Diff the whole push, not just its last commit. New branches have no "before".
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              DIFF=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || echo "ALL")
            else
              DIFF="ALL"
            fi
          fi
          echo "Changed files:"
          echo "$DIFF"

          RUN_MACOS=false
          RUN_ANDROID=false

          if [ "$DIFF" = "ALL" ] || echo "$DIFF" | grep -qE '^(macos/|AGENTS.md|\.github/)'; then
            RUN_MACOS=true
          fi

          if [ "$DIFF" = "ALL" ] || echo "$DIFF" | grep -qE '^(android/|AGENTS.md|\.github/)'; then
            RUN_ANDROID=true
          fi

          if [ "$RUN_MACOS" = "false" ] && [ "$RUN_ANDROID" = "false" ]; then
            RUN_MACOS=true
            RUN_ANDROID=true
          fi

          echo "run-macos=$RUN_MACOS" >> "$GITHUB_OUTPUT"
          echo "run-android=$RUN_ANDROID" >> "$GITHUB_OUTPUT"

  macos:
    needs: detect-changes
    if: needs.detect-changes.outputs.run-macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - run: swift test --package-path macos/BinderClipMac
      - run: ./macos/debug-install.sh --no-launch
      - run: python3 scripts/verify-debug-artifacts.py --mac "$HOME/Applications/BinderClip Debug.app"

  android:
    needs: detect-changes
    if: needs.detect-changes.outputs.run-android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - run: ./android/gradlew -p android testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
      - run: python3 scripts/verify-debug-artifacts.py --android android/app/build
