name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Run this workflow on a release tag such as v1.2.3."
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: release-version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Load stable Mac signing identity
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          MACOS_SIGNING_FINGERPRINT: ${{ secrets.MACOS_SIGNING_FINGERPRINT }}
        run: python3 macos/mac-signing.py setup

      - name: Test macOS app
        run: swift test --package-path macos/BinderClipMac

      - name: Build macOS app and DMG
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          test -n "$MACOS_SIGNING_IDENTITY"
          ./macos/package-release.sh

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
        run: |
          SPARKLE_BIN="macos/BinderClipMac/.build/release-package/arm64/artifacts/sparkle/Sparkle/bin"
          if [ ! -x "$SPARKLE_BIN/generate_appcast" ]; then
            SPARKLE_BIN="macos/BinderClipMac/.build/artifacts/sparkle/Sparkle/bin"
          fi
          if [ ! -x "$SPARKLE_BIN/generate_appcast" ]; then
            FOUND_BIN="$(find macos/BinderClipMac/.build -name "generate_appcast" -type f -perm +111 2>/dev/null | head -n 1)"
            if [ -n "$FOUND_BIN" ]; then
              SPARKLE_BIN="$(dirname "$FOUND_BIN")"
            fi
          fi
          test -x "$SPARKLE_BIN/generate_appcast"
          mkdir -p appcast-input
          cp dist/BinderClip-*.zip appcast-input/
          KEY_FILE=$(mktemp)
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" > "$KEY_FILE"
          "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "$RELEASE_URL" \
            appcast-input
          rm -f "$KEY_FILE"
          grep -q '<sparkle:hardwareRequirements>arm64</sparkle:hardwareRequirements>' appcast-input/appcast.xml
          cp appcast-input/appcast.xml dist/appcast.xml

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release-assets
          path: |
            dist/BinderClip-*.dmg
            dist/BinderClip-*.zip
            dist/appcast.xml

      - name: Remove temporary Mac signing keychain
        if: always() && env.MACOS_SIGNING_DIRECTORY != ''
        run: python3 macos/mac-signing.py cleanup

  build-android:
    needs: release-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android compile SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > android/clipboard-release.keystore

      - name: Build signed APK
        env:
          BINDERCLIP_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          BINDERCLIP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BINDERCLIP_STORE_FILE: ${{ github.workspace }}/android/clipboard-release.keystore
          VERSION_NAME: ${{ needs.release-version.outputs.version }}
        run: |
          ./android/gradlew -p android testDebugUnitTest :app:assembleRelease

      - name: Verify and name release APK
        env:
          VERSION_NAME: ${{ needs.release-version.outputs.version }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          version_code=$(git rev-list --count HEAD)
          metadata=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | sed -n '/^package: /p')
          expected="package: name='net.wastu.binderclip' versionCode='$version_code' versionName='$VERSION_NAME'"
          if [[ "$metadata" != "$expected "* ]]; then
            echo "::error::BinderClip APK package or version does not match the release tag and commit."
            exit 1
          fi
          mv "$apk" "BinderClip-$VERSION_NAME.apk"

      - name: Upload Android release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-assets
          path: BinderClip-*.apk

  publish:
    needs: [release-version, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download all release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          assets=(
            "release-assets/BinderClip-$VERSION.apk"
            "release-assets/BinderClip-$VERSION.dmg"
            "release-assets/BinderClip-$VERSION.zip"
            "release-assets/appcast.xml"
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --title "BinderClip $GITHUB_REF_NAME" --generate-notes
          fi
